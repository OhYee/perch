name: CI and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan clean checkout for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan tracked candidate files
        env:
          GOTOOLCHAIN: local
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 dir --redact=100 --no-banner .

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.13.0', '26.x']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test offline fixtures
        run: npm test
      - name: Test release helpers
        run: node --test .github/scripts/release.test.mjs
      - name: Prepare and smoke-test the package
        id: package
        env:
          OUTPUT_DIR: ${{ runner.temp }}/perch-package
        run: node .github/scripts/prepare-package.mjs "$OUTPUT_DIR"
      - name: Save the tested release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.receipt }}

  portable-smoke:
    name: Portable smoke ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Build portable artifacts on their native platform
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(bun --version)" = '1.4.4'
          node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH || (process.platform === "linux" && !process.report.getReport().header.glibcVersionRuntime)) throw Error("unexpected runner platform, architecture, or libc")'
          npm ci --ignore-scripts --no-audit --no-fund
          bun scripts/build-portable.mjs "$RUNNER_TEMP/perch-binary" "$TARGET"
          if [[ "$TARGET" == linux-x64 ]]; then
            bun scripts/build-portable.mjs "$RUNNER_TEMP/perch-mjs" mjs
          fi
      - name: Smoke-test the exact artifacts on their native platform
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          directories=("$RUNNER_TEMP/perch-binary")
          artifacts=("$RUNNER_TEMP/perch-binary/perch-$TARGET")
          if [[ "$TARGET" == linux-x64 ]]; then
            directories+=("$RUNNER_TEMP/perch-mjs")
            artifacts+=("$RUNNER_TEMP/perch-mjs/perch.mjs")
          fi
          for dir in "${directories[@]}"; do
            entries=("$dir"/*)
            test "${#entries[@]}" -eq 1
          done
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact" && test ! -L "$artifact"
            before="$(shasum -a 256 "$artifact" | cut -d ' ' -f 1)"
            if [[ "$artifact" != *.mjs ]]; then chmod u+x "$artifact"; fi
            node scripts/smoke-portable.mjs "$artifact"
            after="$(shasum -a 256 "$artifact" | cut -d ' ' -f 1)"
            test "$before" = "$after"
            printf '%s\n' "$after" > "$artifact.sha256"
          done
      - name: Save the tested binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-portable-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/perch-binary/perch-${{ matrix.target }}
            ${{ runner.temp }}/perch-binary/perch-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save the tested JavaScript bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-portable-mjs
          path: |
            ${{ runner.temp }}/perch-mjs/perch.mjs
            ${{ runner.temp }}/perch-mjs/perch.mjs.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release-intent:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.intent.outputs.release }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
      - name: Determine whether this push changes the version
        id: intent
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT: ${{ github.sha }}
        run: node .github/scripts/release-intent.mjs

  release:
    needs: [test, secret-scan, release-intent, portable-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-intent.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.release-intent.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: ${{ runner.temp }}/perch-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-portable-*
          merge-multiple: true
          path: ${{ runner.temp }}/perch-package
      - name: Finalize and verify all tested assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/perch-package
          RECEIPT_DIR: ${{ runner.temp }}/perch-receipts
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          for receipt in "$OUTPUT_DIR"/*.sha256; do
            test -f "$receipt" && test ! -L "$receipt"
            mv "$receipt" "$RECEIPT_DIR/"
          done
          node .github/scripts/publish-release.mjs --finalize "$OUTPUT_DIR" "$RECEIPT_DIR"
          node .github/scripts/publish-release.mjs --verify "$OUTPUT_DIR"
      - name: Publish the exact tested release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.release-intent.outputs.version }}
          OUTPUT_DIR: ${{ runner.temp }}/perch-package
        run: node .github/scripts/publish-release.mjs
